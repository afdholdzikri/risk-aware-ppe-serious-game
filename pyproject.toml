[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-aware-ppe-serious-game"
version = "0.1.0"
description = "Research core for a risk-aware PPE serious game"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.38,<2", "pandas>=2.2,<3", "numpy>=2,<3", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "pages*", "engine*", "data*", "database*", "components*"]

[tool.setuptools.package-data]
data = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
